<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="A code snippet on a laptop turned into a short binpaste.xyz link and opened on a phone">
  <!-- Shared illustration for the top of every guide (src/pages/Guide.jsx).
       Colours match the site theme in src/index.css: accent #14b938,
       link blue #7cc4ff, surfaces #232323 / #2f2f2f, borders #3a3a3a. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2b" />
      <stop offset="1" stop-color="#222" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b938" stop-opacity="0.35" />
      <stop offset="1" stop-color="#14b938" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="16" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="1199" height="499" rx="16" fill="none" stroke="#3a3a3a" />

  <!-- Editor window -->
  <g>
    <rect x="56" y="86" width="404" height="328" rx="12" fill="#232323" stroke="#3a3a3a" />
    <path d="M56 98a12 12 0 0 1 12-12h380a12 12 0 0 1 12 12v28H56z" fill="#2f2f2f" />
    <circle cx="82" cy="106" r="6" fill="#ff5f56" />
    <circle cx="102" cy="106" r="6" fill="#ffbd2e" />
    <circle cx="122" cy="106" r="6" fill="#27c93f" />
    <text x="150" y="112" font-family="'Ubuntu Mono', Consolas, monospace" font-size="15" fill="#8a8a8a">auth.js</text>

    <!-- code lines -->
    <g>
      <rect x="84" y="156" width="150" height="10" rx="5" fill="#7cc4ff" opacity="0.85" />
      <rect x="244" y="156" width="80" height="10" rx="5" fill="#6e6e6e" />
      <rect x="100" y="184" width="196" height="10" rx="5" fill="#5c5c5c" />
      <rect x="100" y="212" width="120" height="10" rx="5" fill="#14b938" opacity="0.9" />
      <rect x="230" y="212" width="64" height="10" rx="5" fill="#5c5c5c" />
      <rect x="116" y="240" width="230" height="10" rx="5" fill="#5c5c5c" />
      <rect x="116" y="268" width="150" height="10" rx="5" fill="#e0a800" opacity="0.8" />
      <rect x="100" y="296" width="90" height="10" rx="5" fill="#5c5c5c" />
      <rect x="84" y="324" width="176" height="10" rx="5" fill="#7cc4ff" opacity="0.6" />
      <rect x="84" y="352" width="110" height="10" rx="5" fill="#5c5c5c" />
    </g>
  </g>

  <!-- Arrow and the resulting link -->
  <g>
    <rect x="500" y="196" width="256" height="52" rx="26" fill="#232323" stroke="#14b938" />
    <text x="628" y="229" text-anchor="middle" font-family="'Ubuntu Mono', Consolas, monospace" font-size="19" fill="#14b938">binpaste.xyz/fix-login</text>
    <rect x="500" y="252" width="256" height="40" fill="url(#glow)" opacity="0.5" />
    <path d="M508 316h228" stroke="#14b938" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" />
    <path d="M732 306l16 10-16 10z" fill="#14b938" />
    <text x="508" y="352" font-family="Ubuntu, system-ui, sans-serif" font-size="16" fill="#9a9a9a">one link, no account</text>
  </g>

  <!-- Phone -->
  <g>
    <rect x="880" y="56" width="232" height="388" rx="28" fill="#2f2f2f" stroke="#3a3a3a" />
    <rect x="896" y="88" width="200" height="324" rx="14" fill="#1d1d1d" stroke="#3a3a3a" />
    <rect x="964" y="68" width="64" height="8" rx="4" fill="#3a3a3a" />
    <text x="916" y="122" font-family="'Ubuntu Mono', Consolas, monospace" font-size="14" fill="#14b938">fix-login</text>
    <g>
      <rect x="916" y="146" width="120" height="9" rx="4.5" fill="#7cc4ff" opacity="0.8" />
      <rect x="930" y="172" width="150" height="9" rx="4.5" fill="#5c5c5c" />
      <rect x="930" y="198" width="96" height="9" rx="4.5" fill="#14b938" opacity="0.85" />
      <rect x="944" y="224" width="130" height="9" rx="4.5" fill="#5c5c5c" />
      <rect x="944" y="250" width="86" height="9" rx="4.5" fill="#5c5c5c" />
      <rect x="930" y="276" width="140" height="9" rx="4.5" fill="#7cc4ff" opacity="0.55" />
      <rect x="916" y="302" width="104" height="9" rx="4.5" fill="#5c5c5c" />
      <rect x="916" y="328" width="150" height="9" rx="4.5" fill="#5c5c5c" />
    </g>
    <rect x="916" y="364" width="160" height="30" rx="15" fill="#14b938" opacity="0.15" stroke="#14b938" />
    <text x="996" y="384" text-anchor="middle" font-family="Ubuntu, system-ui, sans-serif" font-size="14" fill="#14b938">Copy</text>
  </g>
</svg>
