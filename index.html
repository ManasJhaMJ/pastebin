<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="canonical" href="https://binpaste.vercel.app/" />

  <title>BinPaste — Free Pastebin to Share Code &amp; Text Online</title>
  <meta name="description"
    content="BinPaste is a free, fast pastebin for sharing code snippets and text online. Create a paste with a custom name, get a shareable link, and share temporary text or code with friends and teammates." />
  <meta name="keywords"
    content="binpaste, pastebin, paste bin, online pastebin, share code, share text, code sharing, text sharing, paste code online, temporary text, temporary paste, snippet sharing, code snippet, share snippet, paste link, free pastebin, syntax highlighting pastebin, paste website, share python code, share javascript code, share html code" />
  <meta name="author" content="Manas Jha" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#2b2b2b" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BinPaste" />
  <meta property="og:title" content="BinPaste — Free Pastebin to Share Code &amp; Text Online" />
  <meta property="og:description"
    content="Share code and text instantly with BinPaste. Create a paste, get a custom link, and share snippets with syntax highlighting for free." />
  <meta property="og:url" content="https://binpaste.vercel.app/" />
  <meta property="og:image" content="https://binpaste.vercel.app/logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="BinPaste — Free Pastebin to Share Code &amp; Text Online" />
  <meta name="twitter:description"
    content="Free pastebin for sharing code and text. Custom paste names, syntax highlighting, public pastes, and instant shareable links." />
  <meta name="twitter:image" content="https://binpaste.vercel.app/logo.png" />

  <!-- Structured data: WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "BinPaste",
    "alternateName": "BinPaste Pastebin",
    "url": "https://binpaste.vercel.app/",
    "description": "Free pastebin to share code snippets and text online with custom paste names and syntax highlighting.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://binpaste.vercel.app/{search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Structured data: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "BinPaste",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any (Web)",
    "description": "Free online pastebin for sharing code snippets and temporary text with custom links and syntax highlighting.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8625188809165779"
     crossorigin="anonymous">
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
